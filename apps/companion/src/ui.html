<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Watchdesk Companion</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color: #e8eaed;
        background: #12141a;
      }
      body {
        margin: 0;
        padding: 16px;
      }
      h1 {
        font-size: 1.1rem;
        margin: 0 0 8px;
      }
      p,
      label {
        font-size: 0.85rem;
        color: #9aa0a6;
      }
      input,
      button,
      select {
        width: 100%;
        box-sizing: border-box;
        margin: 4px 0 10px;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #3c4043;
        background: #1e2128;
        color: #e8eaed;
      }
      button {
        cursor: pointer;
        background: #8ab4f8;
        color: #202124;
        border: none;
        font-weight: 600;
      }
      button.secondary {
        background: transparent;
        color: #8ab4f8;
        border: 1px solid #3c4043;
      }
      .banner {
        background: #3c2f00;
        border: 1px solid #f9ab00;
        color: #fdd663;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 12px;
        font-size: 0.85rem;
      }
      .ok {
        color: #81c995;
      }
      .err {
        color: #f28b82;
      }
      #log {
        white-space: pre-wrap;
        font-size: 0.75rem;
        max-height: 160px;
        overflow: auto;
        background: #0c0e12;
        padding: 8px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <h1>Watchdesk Companion <span id="ver"></span></h1>
    <div id="update" class="banner" hidden></div>
    <p id="status" class="ok">Pronto.</p>
    <label>Origem (HTTPS da sala)</label>
    <input id="origin" placeholder="https://watchdesk-giganet.ilumea.com.br" />
    <label>Slug da sala</label>
    <input id="room" />
    <label>Chave do host</label>
    <input id="hostKey" type="password" />
    <label>Tela</label>
    <select id="source"></select>
    <button id="refreshSources" class="secondary" type="button">Atualizar telas</button>
    <button id="connect" type="button">Conectar e transmitir</button>
    <button id="stop" class="secondary" type="button" disabled>Parar</button>
    <p>Piloto (interagir): <span id="pilot">ninguém</span></p>
    <button id="revoke" class="secondary" type="button" disabled>Revogar controle</button>
    <p id="hint" style="margin-top:8px">Linux: precisa do <code>xdotool</code> no PATH para injetar mouse/teclado.</p>
    <div id="log"></div>
    <script src="./renderer.js"></script>
  </body>
</html>

x-rotacao-logs: &rotacao_logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-limites: &api_limites
  mem_limit: ${API_MEMORY_LIMIT:-512m}
  cpus: ${API_CPUS:-1.0}
  pids_limit: ${API_PIDS_LIMIT:-256}
  tmpfs:
    - /tmp:size=${API_TMP_SIZE:-64m},mode=1777
  logging: *rotacao_logs

x-caddy-base: &caddy_base
  init: true
  image: caddy:2-alpine
  restart: unless-stopped
  mem_limit: ${CADDY_MEMORY_LIMIT:-256m}
  cpus: ${CADDY_CPUS:-0.5}
  pids_limit: 128
  environment:
    DOMAIN: ${DOMAIN:-http://watchdesk}
  volumes:
    - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    - ./caddy/upstream.caddy:/etc/caddy/upstream.caddy:ro
    - ./site:/opt:ro
    - ./companion:/opt/companion:ro
    - caddy_data:/data
    - caddy_config:/config
  logging: *rotacao_logs

services:
  mysql:
    image: mysql:8.4
    profiles: [mysql, local]
    environment:
      MYSQL_DATABASE: watchdesk
      MYSQL_USER: watchdesk
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-watchdesk}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging: *rotacao_logs
    restart: unless-stopped

  turn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    env_file: .env
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --external-ip=${PUBLIC_HOST}
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${TURN_REALM:-watchdesk}
      - --listening-ip=0.0.0.0
      - --relay-ip=0.0.0.0
    volumes:
      - ./turn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "50100-50200:50100-50200/udp"
    logging: *rotacao_logs
    networks:
      - default

  api_blue:
    <<: *api_limites
    image: ${API_IMAGE_BLUE:-ghcr.io/cristian-israel/watchdesk-api:main}
    profiles: [blue]
    env_file: .env
    environment: &api_env
      NODE_ENV: production
      PORT: ${PORT:-7030}
      DATABASE_URL: ${DATABASE_URL:-mysql://watchdesk:${MYSQL_PASSWORD:-}@mysql:3306/watchdesk}
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_HOST: ${TURN_HOST:-}
      TURN_PORT: ${TURN_PORT:-3478}
      TURN_REALM: ${TURN_REALM:-watchdesk}
    depends_on: &api_depends
      mysql:
        condition: service_healthy
        required: false
    healthcheck: &api_health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7030/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - default
      - infra

  api_green:
    <<: *api_limites
    image: ${API_IMAGE_GREEN:-ghcr.io/cristian-israel/watchdesk-api:main}
    profiles: [green]
    env_file: .env
    environment: *api_env
    depends_on: *api_depends
    healthcheck: *api_health
    restart: unless-stopped
    networks:
      - default
      - infra

  # --- Caddy na frontier (prod-hub: tunnel e/ou alias; sem portas no host) ---
  caddy:
    <<: *caddy_base
    profiles: [frontier]
    networks:
      default:
        aliases:
          - caddy
      frontier:
        aliases:
          - ${FRONTIER_ALIAS:-watchdesk}

  # --- Caddy local (portas no host; lab / máquina única) ---
  caddy_local:
    <<: *caddy_base
    profiles: [local]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/upstream.caddy:/etc/caddy/upstream.caddy:ro
      - ./site:/opt:ro
      - caddy_local_data:/data
      - caddy_local_config:/config
    networks:
      default:
        aliases:
          - caddy

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
  caddy_local_data:
  caddy_local_config:

networks:
  frontier:
    external: true
    name: ${FRONTIER_NETWORK:-frontier}
  infra:
    external: true
    name: ${INFRA_NETWORK:-infra}

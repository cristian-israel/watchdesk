x-rotacao-logs: &rotacao_logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-limites: &api_limites
  mem_limit: ${API_MEMORY_LIMIT:-512m}
  cpus: ${API_CPUS:-1.0}
  pids_limit: ${API_PIDS_LIMIT:-256}
  tmpfs:
    - /tmp:size=${API_TMP_SIZE:-256m},mode=1777
  logging: *rotacao_logs

services:
  api_blue:
    <<: *api_limites
    image: ${API_IMAGE_BLUE:-ghcr.io/cristian-israel/watchdesk-api:main}
    profiles: [blue]
    env_file: .env
    environment: &api_env
      NODE_ENV: production
      PORT: ${PORT:-7030}
      WEBRTC_PORT: ${WEBRTC_PORT:-7031}
      SOURCE: ${SOURCE:-browser}
      PUBLIC_HOST: ${PUBLIC_HOST:-}
    # Única porta no host: mídia WebRTC (o Tunnel não leva UDP bem).
    ports:
      - "${WEBRTC_PORT:-7031}:${WEBRTC_PORT:-7031}/tcp"
      - "${WEBRTC_PORT:-7031}:${WEBRTC_PORT:-7031}/udp"
    healthcheck: &api_health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7030/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - default

  api_green:
    <<: *api_limites
    image: ${API_IMAGE_GREEN:-ghcr.io/cristian-israel/watchdesk-api:main}
    profiles: [green]
    env_file: .env
    environment: *api_env
    ports:
      - "${WEBRTC_PORT:-7031}:${WEBRTC_PORT:-7031}/tcp"
      - "${WEBRTC_PORT:-7031}:${WEBRTC_PORT:-7031}/udp"
    healthcheck: *api_health
    restart: unless-stopped
    networks:
      - default

  caddy:
    init: true
    image: caddy:2
    restart: unless-stopped
    mem_limit: ${CADDY_MEMORY_LIMIT:-256m}
    cpus: ${CADDY_CPUS:-0.5}
    pids_limit: 128
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/upstream.caddy:/etc/caddy/upstream.caddy:ro
      - ./site:/srv:ro
    networks:
      default:
      edge:
        aliases:
          - ${EDGE_ALIAS}
    logging: *rotacao_logs

networks:
  edge:
    external: true
    name: edge

x-rotacao-logs: &rotacao_logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-limites: &api_limites
  mem_limit: ${API_MEMORY_LIMIT:-512m}
  cpus: ${API_CPUS:-1.0}
  pids_limit: 256
  tmpfs:
    - /tmp:size=256m,mode=1777
  logging: *rotacao_logs

services:
  api_blue:
    <<: *api_limites
    image: ${API_IMAGE_BLUE:-ghcr.io/cristian-israel/sala-tela-api:main}
    profiles: [blue]
    env_file: .env
    environment: &api_env
      NODE_ENV: production
      PORT: 9000
      SOURCE: ${SOURCE:-browser}
      PUBLIC_HOST: ${PUBLIC_HOST:-}
    ports:
      - "8189:8189/tcp"
      - "8189:8189/udp"
    healthcheck: &api_health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  api_green:
    <<: *api_limites
    image: ${API_IMAGE_GREEN:-ghcr.io/cristian-israel/sala-tela-api:main}
    profiles: [green]
    env_file: .env
    environment: *api_env
    ports:
      - "8189:8189/tcp"
      - "8189:8189/udp"
    healthcheck: *api_health
    restart: unless-stopped

  caddy:
    init: true
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: ${CADDY_MEMORY_LIMIT:-256m}
    cpus: ${CADDY_CPUS:-0.5}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/upstream.caddy:/etc/caddy/upstream.caddy:ro
      - ./site:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *rotacao_logs

volumes:
  caddy_data:
  caddy_config:
